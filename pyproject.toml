[project]
name = "pyetrade"
version = "2.1.2"
description = "eTrade API wrapper with async support"
authors = [
    {name = "Jesse Cooper", email = "jesse_cooper@codeholics.com"}
]
license = {text = "GPL-3.0"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-dateutil>=2.9.0",
    "httpx>=0.27.0",
    "authlib>=1.3.0",
    "xmltodict>=0.13.0",
    "jxmlease>=1.0.3",
]

[project.optional-dependencies]
dev = [
    "black>=24.4.0",
    "coverage>=7.4.4",
    "flake8>=7.0.0",
    "pre-commit>=3.7.0",
    "pylint>=3.1.0",
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.22.0",
    "Sphinx>=7.3.6",
    "tox>=4.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.coverage.run]
source = ["pyetrade"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
