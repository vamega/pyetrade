name: build
on:
  push:
    branches:
      - master
  pull_request:
    branches: [ master ]
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.13', '3.14' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run tests
        run: uv run --locked pytest --cov=pyetrade --cov-report=xml tests

      - name: Build documentation
        run: uv run --locked python -m sphinx -M html docs docs/_build

      - name: Upload coverage
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7.0.0
        with:
          files: coverage.xml
          use_oidc: true
